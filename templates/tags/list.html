{% extends "base.html" %}

{% block title %}
  Tags · {{ config.title }}
{% endblock title %}

{% block content %}
<h1>{{ taxonomy.name | capitalize }}</h1>
<ul>
  {% for t in terms %}
  <li>
    <a href="{{ t.permalink }}">{{ t.name }}</a> ({{ t.pages | length }})
  </li>
  {% endfor %}
</ul>
{% endblock content %}
