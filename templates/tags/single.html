{% extends "base.html" %}

{% block content %}
<h1># {{ term.name }}</h1>

<ul class="post-list">
  {% for page in term.pages %}
  <li class="post-row">
    <a class="post-title" href="{{ page.permalink }}">{{ page.title }}</a>
    <span class="post-meta">
      <time class="meta-date">{{ page.date | date(format="%Y-%m-%d") }}</time>
    </span>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
