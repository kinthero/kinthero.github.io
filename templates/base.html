<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
      {{ page?.title or section?.title or term?.name or taxonomy?.name or config.title }}
    </title>

    <meta name="description" content="{{ page?.description or section?.description or config.description }}">
    <link rel="canonical" href="{{ current_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:title" content="{{ page?.title or section?.title or term?.name or taxonomy?.name or config.title }}">
    <meta property="og:description" content="{{ page?.description or section?.description or config.description }}">
    <meta property="og:url" content="{{ current_url }}">

    <link id="giallo-light" rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}"
media="(prefers-color-scheme: light)">
    <link id="giallo-dark" rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(
prefers-color-scheme: dark)">
    <script src="{{ get_url(path='js/theme.js') }}"></script>
    <script src="{{ get_url(path='js/code-copy.js') }}" defer></script>
    <script src="{{ get_url(path='js/toc-spy.js') }}" defer></script>
    <script src="{{ get_url(path='js/scroll-ui.js') }}" defer></script>
    <link rel="stylesheet" href="{{ get_url(path='main.css', cachebust=true) }}">
    {% block rss %}
    <link rel="alternate" type="application/atom+xml" title="Atom" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
    {% endblock rss %}
  </head>

  <body class="{% if current_path is starting_with(pat="/handbook") %}layout-handbook{% else %}layout-blog{% endif %}">
    <div id="reading-progress" class="reading-progress"></div>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="{{ config.base_url }}">
          {{config.title}}
        </a>

        <nav class="site-nav">
          <a href="{{ get_url(path='@/blog/_index.md') }}"
            {% if current_path is starting_with(pat="/blog") or current_path is starting_with(pat="/tags") %}
            class="active"
            {% endif %}>
            Blog
          </a>
          <a href="{{ get_url(path='@/handbook/_index.md') }}"
            {% if current_path is starting_with(pat="/handbook") %}
            class="active"
            {% endif %}>
            Handbook
          </a>
          <a href="{{ get_url(path='@/search.md') }}">Search</a>
          <button id="theme-toggle" class="theme-btn" aria-label="切换主题"></button>
        </nav>
      </div>
    </header>

    <div class="layout">

      <aside class="sidebar">
        {% block sidebar %}{% endblock %}
      </aside>

      <main>
        {% block content %}{% endblock %}
      </main>

      <aside class="toc">
        {% block toc %} {% endblock %}
      </aside>
      
    </div>

    <footer>
      <div class="footer-inner">
        <span>© {{ now() | date(format="%Y") }} {{config.title}}</span>
        <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">RSS</a>
      </div>
    </footer>
    <button id="back-to-top" class="back-to-top" aria-label="回到顶部">↑</button>
  </body>
</html>
