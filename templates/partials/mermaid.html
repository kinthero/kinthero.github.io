<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";

  function effectiveTheme() {
    const t = document.documentElement.dataset.theme;
    return t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").
matches) ? "dark" : "neutral";
  }

  const blocks = [...document.querySelectorAll('code[data-lang="mermaid"]')].map((code) => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.dataset.source = code.textContent;
    div.textContent = code.textContent;
    code.closest("pre").replaceWith(div);
    return div;
  });

  mermaid.initialize({ startOnLoad: false, theme: effectiveTheme() });
  await mermaid.run({ nodes: blocks });

  document.addEventListener("themechange", async (e) => {
    mermaid.initialize({ startOnLoad: false, theme: e.detail === "dark" ? "dark" : "neutral" });
    for (const el of blocks) {
      el.textContent = el.dataset.source;
      el.removeAttribute("data-processed");
    }
    await mermaid.run({ nodes: blocks });
  });
</script>
